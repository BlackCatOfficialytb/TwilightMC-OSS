[package]
name = "twilight-cas"
description = "Cross-platform Content-Addressable Storage (CAS) and cascading zero-copy link engine (Hardlink, NTFS Junction, Symlink, Copy fallback) inspired by uv"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
repository = "https://github.com/BlackCatOfficialytb/TwilightMC-OSS"
homepage = "https://github.com/BlackCatOfficialytb/TwilightMC-OSS/tree/main/crates/twilight-cas"
readme = "README.md"
keywords = ["cas", "hardlink", "symlink", "deduplication", "storage"]
categories = ["filesystem", "caching"]

[dependencies]
tokio = { workspace = true }
sha1 = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
