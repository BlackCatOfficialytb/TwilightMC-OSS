[package]
name = "twilight-modrinth"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Modrinth .mrpack engine for TwilightMC: index schema, client-env staging, overrides extraction and a pure-Rust ZIP/DEFLATE reader"

[dependencies]
