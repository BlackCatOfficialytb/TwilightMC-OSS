[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.4"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
bytes = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
uuid = { version = "1", features = ["serde"] }
futures = "0.3"
clap = { version = "4", features = ["derive", "env"] }
tauri = "2"
tauri-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
