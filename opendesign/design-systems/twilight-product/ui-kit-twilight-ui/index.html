<!doctype html>
<html lang="en" class="dark h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>twilight-ui kit — twilight-product</title>
    <link rel="icon" type="image/png" href="../assets/logos/logo.png" />
    <link rel="stylesheet" href="../tokens/colors_and_type.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--plate-bg, #06090f);
        font-family: var(--font-sans);
        font-size: var(--step-body);
        color: var(--fg-1);
        -webkit-font-smoothing: antialiased;
      }
      .dark { --plate-bg: #06090f; }
      .light { --plate-bg: #e3e7ee; }
      .head {
        position: sticky; top: 0; z-index: 5;
        display: flex; align-items: center; gap: 12px;
        padding: 10px 20px;
        background: color-mix(in srgb, var(--plate-bg) 92%, transparent);
        border-bottom: 1px solid var(--border-1);
      }
      .head img { width: 22px; height: 22px; border-radius: 4px; }
      .head b { font-size: var(--step-card); font-weight: 600; }
      .head .sub { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
      .tht { margin-left: auto; display: flex; gap: 4px; }
      .tht button {
        border: 1px solid var(--border-1); background: transparent; color: var(--fg-2);
        font-family: var(--font-sans); font-size: var(--step-body);
        padding: 4px 12px; border-radius: 4px; cursor: pointer;
      }
      .tht button:hover { background: var(--bg-3); color: var(--fg-1); }
      html.dark .tht .td, html.light .tht .tl {
        background: var(--accent-1); color: var(--on-accent); border-color: var(--accent-1);
      }
      .plate { max-width: 1180px; margin: 26px auto; padding: 0 20px; }
      .cap {
        font-family: var(--font-mono); font-size: 11px; color: var(--fg-2);
        letter-spacing: 0.04em; margin-bottom: 8px;
      }
      .art {
        border: 1px solid var(--border-1); border-radius: 10px;
        background: var(--bg-1); padding: 18px;
      }
      .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .row + .row { margin-top: 10px; }
      .footnote {
        max-width: 1180px; margin: 18px auto 48px; padding: 0 20px;
        font-size: var(--step-meta); color: var(--fg-2); line-height: 1.6;
      }
      .footnote .mono { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; }
      .demo-modal { position: relative; height: 480px; }
      .demo-panel { display: flex; height: 432px; }
      .demo-body { flex: 1; min-width: 0; padding: 16px; overflow: hidden; }
      .demo-foot {
        display: flex; justify-content: flex-end; gap: 8px;
        padding: 12px 16px; border-top: 1px solid var(--border-1);
      }
      .mtable { background: var(--bg-3); border: 1px solid var(--border-1); border-radius: 6px; margin-top: 12px; }
      .mrow { display: flex; align-items: center; gap: 12px; padding: 8px 12px; }
      .mrow + .mrow { border-top: 1px solid var(--border-1); }
      .mfile { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); }
      .xbtn { margin-left: auto; color: #fb7185; background: transparent; border: none; cursor: pointer; padding: 2px 6px; border-radius: 4px; font-size: var(--step-body); }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

    <script type="text/babel" src="components/Button.jsx"></script>
    <script type="text/babel" src="components/Pill.jsx"></script>
    <script type="text/babel" src="components/ToggleSwitch.jsx"></script>
    <script type="text/babel" src="components/InstanceCard.jsx"></script>
    <script type="text/babel" src="components/Modal.jsx"></script>
    <script type="text/babel" src="components/TabRail.jsx"></script>

    <script type="text/babel">
      function DemoToggle({ initial }) {
        const [on, setOn] = React.useState(initial);
        return <ToggleSwitch on={on} label="demo toggle" onChange={setOn} />;
      }

      function App() {
        const [dark, setDark] = React.useState(true);
        const [tab, setTab] = React.useState("mods");
        React.useEffect(() => {
          const el = document.documentElement;
          el.classList.toggle("dark", dark);
          el.classList.toggle("light", !dark);
        }, [dark]);

        const tabs = [
          { id: "components", label: "Version components" },
          { id: "mods", label: "Mods" },
          { id: "screenshots", label: "Screenshots" },
          { id: "logs", label: "Logs" },
        ];

        return (
          <div>
            <header className="head">
              <img src="../assets/logos/logo.png" alt="TwilightMC logomark" />
              <b>twilight-ui kit</b>
              <span className="sub">twilight-product · tokens: ../tokens/colors_and_type.css</span>
              <div className="tht">
                <button className="td" onClick={() => setDark(true)}>◑ Dark</button>
                <button className="tl" onClick={() => setDark(false)}>☀ Light</button>
              </div>
            </header>

            <section className="plate">
              <div className="cap">button — primary / ghost / danger · sm + md · disabled · focus</div>
              <div className="art">
                <div className="row">
                  <Button variant="primary">＋ New Instance</Button>
                  <Button>⤓ Get More Mods</Button>
                  <Button variant="danger">✕ Delete Permanently</Button>
                </div>
                <div className="row">
                  <Button variant="primary" size="sm">⤓ Install</Button>
                  <Button size="sm">♻ Refresh</Button>
                  <Button variant="primary" disabled>＋ Add Mod</Button>
                  <Button variant="ghost" disabled>📂 Open Mods Folder</Button>
                </div>
                <div className="row">
                  <span style={{ outline: "1px solid var(--accent-1)", outlineOffset: 2, borderRadius: 4 }}>
                    <Button variant="primary">focused</Button>
                  </span>
                </div>
              </div>
            </section>

            <section className="plate">
              <div className="cap">pill — neutral (versions) / brand (light loaders) / star (heavy loaders, warnings)</div>
              <div className="art">
                <div className="row">
                  <Pill tone="neutral">1.21.4</Pill>
                  <Pill tone="brand">Fabric</Pill>
                  <Pill tone="brand">Quilt</Pill>
                  <Pill tone="star">Forge</Pill>
                  <Pill tone="star">NeoForge</Pill>
                  <Pill tone="star">pre-release</Pill>
                </div>
              </div>
            </section>

            <section className="plate">
              <div className="cap">toggle switch — on / off / disabled · 36×20, 120ms track fill</div>
              <div className="art">
                <div className="row">
                  <DemoToggle initial={true} />
                  <DemoToggle initial={false} />
                  <ToggleSwitch on={true} disabled label="disabled on" />
                  <ToggleSwitch on={false} disabled label="disabled off" />
                </div>
              </div>
            </section>

            <section className="plate">
              <div className="cap">instance card — hover the leftmost two: cyan border + ▶ play scrim · third is selected</div>
              <div className="art">
                <div className="row" style={{ alignItems: "flex-start" }}>
                  <InstanceCard
                    name="Twilight Foundry"
                    version="1.21.4"
                    loader="Fabric"
                    lastPlayed="Last played 2h ago"
                    icon="⌗"
                  />
                  <InstanceCard
                    name="sodium-nightly"
                    version="1.21.4"
                    loader="Fabric"
                    lastPlayed="Last played 2h ago"
                    icon="⦚"
                  />
                  <InstanceCard
                    name="Create: Astral Forge"
                    version="1.20.1"
                    loader="NeoForge"
                    loaderTone="star"
                    lastPlayed="Last played yesterday"
                    icon="⚙"
                    selected={true}
                  />
                  <InstanceCard
                    name="Vanilla 1.21.4"
                    version="1.21.4"
                    loader="Vanilla"
                    loaderTone="neutral"
                    lastPlayed="Last played last week"
                    icon="▤"
                  />
                </div>
              </div>
            </section>

            <section className="plate">
              <div className="cap">tab rail — edit-instance sheet nav (interactive)</div>
              <div className="art" style={{ display: "flex", minHeight: 220 }}>
                <TabRail tabs={tabs} active={tab} counts={{ mods: 12 }} onSelect={setTab} />
                <div style={{ flex: 1, padding: 16, color: "var(--fg-2)", fontSize: "var(--step-body)" }}>
                  {tab === "mods"
                    ? "Mods pane: filter input, table of installed mods with toggles, sizes, delete; ＋ Add Mod · ⤓ Get More Mods · 📂 Open Mods Folder."
                    : "Placeholder pane for “" + tab + "” — content lands in later milestones."}
                </div>
              </div>
            </section>

            <section className="plate">
              <div className="cap">modal — scrim + 640 edit-instance sheet with rail + mods table (static excerpt)</div>
              <div className="art demo-modal">
                <Modal width={640}>
                  <div className="demo-panel">
                    <TabRail tabs={tabs} active="mods" counts={{ mods: 12 }} />
                    <div className="demo-body">
                      <div style={{ fontSize: "var(--step-heading)", fontWeight: 600 }}>Create: Astral Forge</div>
                      <div className="mfile" style={{ marginTop: 2 }}>1.20.1 · neoforge</div>
                      <div className="mtable">
                        <div className="mrow">
                          <div>
                            <div style={{ fontWeight: 500 }}>Fabric API</div>
                            <div className="mfile">fabric-api.jar · 2.1 MB</div>
                          </div>
                          <ToggleSwitch on={true} label="fabric-api" />
                          <button className="xbtn" title="Delete Fabric API">✕</button>
                        </div>
                        <div className="mrow">
                          <div style={{ opacity: 0.5 }}>
                            <div style={{ fontWeight: 500 }}>Lithium</div>
                            <div className="mfile">lithium.jar.disabled · 412.0 KB</div>
                          </div>
                          <ToggleSwitch on={false} label="lithium" />
                          <button className="xbtn" title="Delete Lithium">✕</button>
                        </div>
                        <div className="mrow">
                          <div>
                            <div style={{ fontWeight: 500 }}>Sodium</div>
                            <div className="mfile">sodium.jar · 1.2 MB</div>
                          </div>
                          <ToggleSwitch on={true} label="sodium" />
                          <button className="xbtn" title="Delete Sodium">✕</button>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div className="demo-foot">
                    <Button variant="ghost" size="sm">📂 Open Mods Folder</Button>
                    <Button size="sm">⤓ Get More Mods</Button>
                    <Button variant="primary" size="sm">＋ Add Mod</Button>
                  </div>
                </Modal>
              </div>
            </section>

            <div className="footnote">
              <div className="mono">RULES THAT BIND THIS KIT</div>
              Cyan is the only interactive accent; amber warns; rose destroys.
              Elevation is value (canvas → surface → well), never shadow — the
              modal panel is the single inherited exception. Accent rides as a
              15% tint except on primary buttons, which are solid cyan with
              dark ink in both themes. Icons are unicode glyphs only. Motion is
              100–150ms over color/opacity/height. See SKILL.md for the full
              grammar.
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
