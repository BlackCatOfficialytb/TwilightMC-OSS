name: release

# Creating a release on GitHub (stable-* / beta-* / alpha-* style tags per
# VERSION.md) triggers this workflow, which runs the quality gates and then
# generates the platform archives and attaches them to the release.
#
# The rolling `snapshot` pre-release is excluded: snapshot.yml builds and
# attaches its archives itself, so this hook would only duplicate it.

on:
  release:
    types: [created]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.release.tag_name != 'snapshot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    if: github.event.release.tag_name != 'snapshot'
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-msvc
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-msvc-x86_64
            bin: twilight.exe
          - id: windows-mingw
            runner: windows-latest
            target: x86_64-pc-windows-gnu
            suffix: windows-mingw-w64
            bin: twilight.exe
          - id: windows-clang
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-clang-x86_64
            bin: twilight.exe
            cc: clang
          - id: linux-gcc
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-gcc-x86_64
            bin: twilight
          - id: linux-clang
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-clang-x86_64
            bin: twilight
            cc: clang
          - id: macos
            runner: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-aarch64
            bin: twilight
          - id: freebsd
            runner: ubuntu-latest
            target: x86_64-unknown-freebsd
            suffix: freebsd-x86_64
            bin: twilight
            vm: freebsd
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Rust
        if: matrix.vm != 'freebsd'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        if: matrix.vm != 'freebsd'
        uses: Swatinem/rust-cache@v2

      # one identity string shared by the artifact upload and the archive name
      - name: Set artifact name
        shell: bash
        run: |
          NAME="twilight-${{ github.event.release.tag_name }}-${{ matrix.suffix }}"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$NAME" >> "$GITHUB_ENV"

      - name: MinGW linker on PATH
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: bash
        run: echo "C:\\msys64\\mingw64\\bin" >> "$GITHUB_PATH"

      - name: Build with Clang/LLVM
        if: matrix.cc == 'clang'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      # The FreeBSD build runs natively inside the VM; only the raw staging
      # folder is copied back — its single archive is built by the attach job.
      - name: Build and stage in FreeBSD VM
        if: matrix.vm == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          sync: rsync
          copyback: true
          prepare: |
            pkg install -y rust
          run: |
            set -e
            NAME="twilight-${{ github.event.release.tag_name }}-${{ matrix.suffix }}"
            cargo build --locked --release
            mkdir -p "dist/$NAME"
            cp target/release/${{ matrix.bin }} README.md LICENSE VERSION.md "dist/$NAME/"
            # keep the copy-back small: the binary already lives in dist/
            rm -rf target

      - name: Build
        if: matrix.vm != 'freebsd'
        run: cargo build --locked --release

      # Raw distribution staging: the four files upload flat (no folder inside
      # the artifact); the attach job archives each target folder exactly once.
      - name: Stage distribution
        if: matrix.vm != 'freebsd'
        shell: bash
        run: |
          set -e
          mkdir -p "dist/${{ env.NAME }}"
          cp target/release/${{ matrix.bin }} README.md LICENSE VERSION.md "dist/${{ env.NAME }}/"

      - name: Upload staged distribution
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/${{ env.NAME }}/*
          if-no-files-found: error

  attach:
    if: github.event.release.tag_name != 'snapshot'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # each artifact lands in dist/<artifact-name>/ — no merge collisions
      - name: Download staged distributions
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Package single release archives
        run: |
          set -e
          mkdir -p release
          for dir in dist/*/; do
            name="$(basename "$dir")"
            case "$name" in
              *windows*)
                (cd "$dir" && zip -qr "${GITHUB_WORKSPACE}/release/$name.zip" .)
                ;;
              *)
                (cd "$dir" && tar -czf "${GITHUB_WORKSPACE}/release/$name.tar.gz" .)
                ;;
            esac
          done
          cd release
          sha256sum * > checksums.sha256

      - name: Attach generated archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release/* --clobber
