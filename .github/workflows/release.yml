name: release

# Stable channel. Pushing a plain `vX.Y.Z` tag (e.g. `v1.0.0`) triggers the
# shared build pipeline, which publishes `TwilightMC <tag>` as a full release
# (`is_prerelease: false`).
#
# Bolide (`alpha-*`) and Star (`beta-*`) tags use alpha.yml / beta.yml; the
# rolling `snapshot` pre-release is built by snapshot.yml. The tag patterns
# are disjoint, so a tag never builds twice.

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      channel: stable
      tag: ${{ github.ref_name }}
      prerelease: false
      rolling: false
