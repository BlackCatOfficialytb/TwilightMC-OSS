name: snapshot

# Rolling Snapshot channel. Pushes to `main` (or a manual dispatch) build the
# workspace and refresh the single rolling `snapshot` pre-release. A dispatch
# runs the same gates and build matrix but publishes nothing, matching the
# documented "manual dispatch = artifacts only" behaviour.
#
# Everything else — gates, 7-target matrix, archives, checksums, release
# publishing — lives in the shared reusable workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      channel: snapshot
      tag: snapshot
      prerelease: true
      rolling: true
      publish: ${{ github.event_name == 'push' }}
