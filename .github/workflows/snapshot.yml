name: snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quality gates run once, fast; every snapshot build waits on this.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      date: ${{ steps.vars.outputs.date }}
      commit: ${{ steps.vars.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - id: vars
        # snapshot identity per VERSION.md: workspace version + ddmmyyyy UTC + short sha
        run: |
          echo "version=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%d%m%Y)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-msvc
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: x86_64-pc-windows-msvc
            bin: twilight.exe
          - id: linux-gcc
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: x86_64-unknown-linux-gnu-gcc
            bin: twilight
          - id: linux-clang
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: x86_64-unknown-linux-gnu-clang
            bin: twilight
            cc: clang
          - id: macos
            runner: macos-latest
            target: aarch64-apple-darwin
            suffix: aarch64-apple-darwin
            bin: twilight
          - id: freebsd
            runner: ubuntu-latest
            target: x86_64-unknown-freebsd
            suffix: x86_64-unknown-freebsd
            bin: twilight
            vm: freebsd
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        if: matrix.vm != 'freebsd'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        if: matrix.vm != 'freebsd'
        uses: Swatinem/rust-cache@v2

      - name: Build with Clang/LLVM
        if: matrix.cc == 'clang'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      # The FreeBSD build runs natively inside the VM; dist/ is rsynced back
      # when the VM step finishes, so the host-side upload below sees it.
      - name: Build and package in FreeBSD VM
        if: matrix.vm == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          sync: rsync
          copyback: true
          prepare: |
            pkg install -y rust
          run: |
            set -e
            NAME="twilight-v${{ needs.verify.outputs.version }}-${{ needs.verify.outputs.date }}-${{ needs.verify.outputs.commit }}-${{ matrix.suffix }}"
            cargo build --locked --release
            mkdir -p "dist/twilight-$NAME"
            cp target/release/${{ matrix.bin }} README.md LICENSE VERSION.md "dist/twilight-$NAME/"
            tar -czf "dist/$NAME.tar.gz" -C dist "twilight-$NAME"
            # keep the copy-back small: the binary already lives in dist/
            rm -rf target

      - name: Build
        if: matrix.vm != 'freebsd'
        run: cargo build --locked --release

      - name: Package
        if: matrix.vm != 'freebsd'
        shell: bash
        run: |
          set -e
          NAME="twilight-v${{ needs.verify.outputs.version }}-${{ needs.verify.outputs.date }}-${{ needs.verify.outputs.commit }}-${{ matrix.suffix }}"
          mkdir -p "dist/twilight-$NAME"
          cp target/release/${{ matrix.bin }} README.md LICENSE VERSION.md "dist/twilight-$NAME/"
          case "${{ matrix.suffix }}" in
            *msvc*) tar -a -cf "dist/$NAME.zip" -C dist "twilight-$NAME" ;;
            *)      tar -czf "dist/$NAME.tar.gz" -C dist "twilight-$NAME" ;;
          esac

      - name: Upload snapshot archive
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.id }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Update rolling snapshot pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          DATE: ${{ needs.verify.outputs.date }}
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          set -e
          # rolling tag: the previous snapshot is superseded, never patched (VERSION.md §2)
          gh release delete snapshot --yes 2>/dev/null || true
          gh release create snapshot dist/* \
            --target "$GITHUB_SHA" \
            --title "TwilightMC Snapshot v${VERSION}-${DATE}-${COMMIT}" \
            --prerelease \
            --notes "TwilightMC Snapshot v${VERSION}-${DATE}-${COMMIT} (commit ${COMMIT}, build date ${DATE} ddmmyyyy UTC). Archives carry the binary, README.md, LICENSE and VERSION.md."
