name: snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quality gates run once, fast; every snapshot build waits on this.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      date: ${{ steps.vars.outputs.date }}
      commit: ${{ steps.vars.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - id: vars
        # snapshot identity per VERSION.md: workspace version + ddmmyyyy UTC + short sha
        run: |
          echo "version=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%d%m%Y)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-msvc
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: x86_64-pc-windows-msvc
            bin: twilight.exe
          - id: windows-mingw
            runner: windows-latest
            target: x86_64-pc-windows-gnu
            suffix: x86_64-pc-windows-gnu
            bin: twilight.exe
          - id: windows-clang
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: x86_64-pc-windows-clang
            bin: twilight.exe
            cc: clang
          - id: linux-gcc
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: x86_64-unknown-linux-gnu-gcc
            bin: twilight
          - id: linux-clang
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: x86_64-unknown-linux-gnu-clang
            bin: twilight
            cc: clang
          - id: macos
            runner: macos-latest
            target: aarch64-apple-darwin
            suffix: aarch64-apple-darwin
            bin: twilight
          - id: freebsd
            runner: ubuntu-latest
            target: x86_64-unknown-freebsd
            suffix: x86_64-unknown-freebsd
            bin: twilight
            vm: freebsd
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        if: matrix.vm != 'freebsd'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        if: matrix.vm != 'freebsd'
        uses: Swatinem/rust-cache@v2

      - name: MinGW linker on PATH
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: bash
        run: echo "C:\\msys64\\mingw64\\bin" >> "$GITHUB_PATH"

      - name: Build with Clang/LLVM
        if: matrix.cc == 'clang'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      # The FreeBSD build runs natively inside the VM; only the raw staging
      # folder is copied back — its single archive is built by the release job.
      - name: Build and stage in FreeBSD VM
        if: matrix.vm == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          sync: rsync
          copyback: true
          prepare: |
            pkg install -y rust
          run: |
            set -e
            NAME="twilight-v${{ needs.verify.outputs.version }}-${{ needs.verify.outputs.date }}-${{ needs.verify.outputs.commit }}-${{ matrix.suffix }}"
            cargo build --locked --release
            mkdir -p "dist/twilight-$NAME"
            cp target/release/${{ matrix.bin }} README.md LICENSE VERSION.md "dist/twilight-$NAME/"
            # keep the copy-back small: the binary already lives in dist/
            rm -rf target

      - name: Build
        if: matrix.vm != 'freebsd'
        run: cargo build --locked --release

      # Raw distribution staging: the folders are uploaded as-is so the
      # Actions artifact stays single-zipped by upload-artifact; the final
      # standalone archives are built only for the GitHub Release.
      - name: Stage distribution
        if: matrix.vm != 'freebsd'
        shell: bash
        run: |
          set -e
          NAME="twilight-v${{ needs.verify.outputs.version }}-${{ needs.verify.outputs.date }}-${{ needs.verify.outputs.commit }}-${{ matrix.suffix }}"
          mkdir -p "dist/twilight-$NAME"
          cp target/release/${{ matrix.bin }} README.md LICENSE VERSION.md "dist/twilight-$NAME/"

      - name: Upload staged distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.id }}
          path: dist/
          if-no-files-found: error

  release:
    needs: [verify, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download staged distributions
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      - name: Package single release archives
        run: |
          set -e
          mkdir -p release
          cd dist
          for dir in twilight-*/; do
            name="$(basename "$dir")"
            case "$name" in
              *windows*)
                zip -qr "../release/$name.zip" "$name"
                ;;
              *)
                tar -czf "../release/$name.tar.gz" "$name"
                ;;
            esac
          done

      - name: Update rolling snapshot pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          DATE: ${{ needs.verify.outputs.date }}
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          set -e
          # rolling tag: the previous snapshot is superseded, never patched (VERSION.md §2)
          gh release delete snapshot --yes 2>/dev/null || true
          gh release create snapshot release/* \
            --target "$GITHUB_SHA" \
            --title "TwilightMC Snapshot v${VERSION}-${DATE}-${COMMIT}" \
            --prerelease \
            --notes "TwilightMC Snapshot v${VERSION}-${DATE}-${COMMIT} (commit ${COMMIT}, build date ${DATE} ddmmyyyy UTC). Archives carry the binary, README.md, LICENSE and VERSION.md."
