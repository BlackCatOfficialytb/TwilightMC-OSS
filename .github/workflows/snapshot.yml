name: snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quality gates run once, fast; every snapshot build waits on this.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      date: ${{ steps.vars.outputs.date }}
      commit: ${{ steps.vars.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # this gate compiles the whole workspace, Tauri UI crate included
      - name: Install Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - id: vars
        # snapshot identity per VERSION.md: workspace version + ddmmyyyy UTC + short sha
        run: |
          echo "version=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%d%m%Y)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-msvc
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-msvc-x86_64
            bin: twilight.exe
          - id: windows-mingw
            runner: windows-latest
            target: x86_64-pc-windows-gnu
            suffix: windows-mingw-w64
            bin: twilight.exe
          - id: windows-clang
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-clang-x86_64
            bin: twilight.exe
            cc: clang
          - id: linux-gcc
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-gcc-x86_64
            bin: twilight
          - id: linux-clang
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-clang-x86_64
            bin: twilight
            cc: clang
          - id: linux-arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: linux-aarch64
            bin: twilight
          - id: macos
            runner: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-aarch64
            bin: twilight
          - id: freebsd
            runner: ubuntu-latest
            target: x86_64-unknown-freebsd
            suffix: freebsd-x86_64
            bin: twilight
            vm: freebsd
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        if: matrix.vm != 'freebsd'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        if: matrix.vm != 'freebsd'
        uses: Swatinem/rust-cache@v2

      # one identity string shared by the artifact upload and the archive name
      - name: Set artifact name
        shell: bash
        run: |
          NAME="twilight-snapshot-v${{ needs.verify.outputs.version }}-${{ needs.verify.outputs.date }}-${{ needs.verify.outputs.commit }}-${{ matrix.suffix }}"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$NAME" >> "$GITHUB_ENV"

      - name: MinGW linker on PATH
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: bash
        run: echo "C:\\msys64\\mingw64\\bin" >> "$GITHUB_PATH"

      - name: Build with Clang/LLVM
        if: matrix.cc == 'clang'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      # ARM64 SBCs (Raspberry Pi 5, Radxa Rock 5, Orange Pi, Asahi): cross-compile
      # on the x86_64 runner; the rust target itself is installed by the
      # toolchain action via `targets: ${{ matrix.target }}`.
      - name: ARM64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # The FreeBSD build runs natively inside the VM; only the raw staging
      # folder is copied back — its single archive is built by the release job.
      - name: Build and stage in FreeBSD VM
        if: matrix.vm == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          sync: rsync
          copyback: true
          prepare: |
            pkg install -y rust
          run: |
            set -e
            NAME="twilight-snapshot-v${{ needs.verify.outputs.version }}-${{ needs.verify.outputs.date }}-${{ needs.verify.outputs.commit }}-${{ matrix.suffix }}"
            cargo build --locked --release --bin twilight
            mkdir -p "dist/$NAME"
            cp target/release/${{ matrix.bin }} README.md LICENSE.md LICENSE_AGPL LICENSE_APACHE VERSION.md "dist/$NAME/"
            # keep the copy-back small: the binary already lives in dist/
            rm -rf target

      - name: Build
        if: matrix.vm != 'freebsd'
        run: cargo build --locked --release --bin twilight

      # Raw distribution staging: the four files upload flat (no folder inside
      # the artifact); the release job archives each target folder exactly once.
      - name: Stage distribution
        if: matrix.vm != 'freebsd'
        shell: bash
        run: |
          set -e
          mkdir -p "dist/${{ env.NAME }}"
          cp target/release/${{ matrix.bin }} README.md LICENSE.md LICENSE_AGPL LICENSE_APACHE VERSION.md "dist/${{ env.NAME }}/"

      - name: Upload staged distribution
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/${{ env.NAME }}/*
          if-no-files-found: error

  release:
    needs: [verify, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # each artifact lands in dist/<artifact-name>/ — no merge collisions
      - name: Download staged distributions
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Package single release archives
        run: |
          set -e
          mkdir -p release
          for dir in dist/*/; do
            name="$(basename "$dir")"
            case "$name" in
              *windows*)
                (cd "$dir" && zip -qr "${GITHUB_WORKSPACE}/release/$name.zip" .)
                ;;
              *)
                (cd "$dir" && tar -czf "${GITHUB_WORKSPACE}/release/$name.tar.gz" .)
                ;;
            esac
          done
          cd release
          sha256sum * > checksums.sha256

      - name: Update rolling snapshot pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          DATE: ${{ needs.verify.outputs.date }}
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          set -e
          # rolling tag: the previous snapshot is superseded, never patched (VERSION.md §2)
          gh release delete snapshot --yes --cleanup-tag 2>/dev/null || true
          gh release create snapshot release/* \
            --target "$GITHUB_SHA" \
            --title "TwilightMC Snapshot v${VERSION}-${DATE}-${COMMIT}" \
            --prerelease \
            --notes "TwilightMC Snapshot v${VERSION}-${DATE}-${COMMIT} (commit ${COMMIT}, build date ${DATE} ddmmyyyy UTC). SHA-256 digests are listed in checksums.sha256."
