name: alpha

# Bolide (alpha) channel. Pushing an `alpha-*` tag (e.g. `alpha-v0.5.1`)
# triggers the shared build pipeline, which publishes the release as
# `TwilightMC Bolide (<tag>)` with `is_prerelease: false`: Bolide builds ship
# as normal GitHub releases so they can be tagged "Latest" and downloaded
# without the pre-release filter.
#
# Stable and Star tags use release.yml / beta.yml; roll-forward pushes use
# snapshot.yml. The tag patterns are disjoint, so a tag never builds twice.

on:
  push:
    tags: ['alpha-*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      channel: alpha
      tag: ${{ github.ref_name }}
      prerelease: false
      rolling: false
