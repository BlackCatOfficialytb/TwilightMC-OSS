name: alpha

# Bolide (alpha) channel. Pushing a compact `vX.Y.ZaN` tag (e.g.
# `v0.7.1a1`) or a legacy `alpha-*` tag (e.g. `alpha-v0.5.1`) triggers the
# shared build pipeline, which publishes the release as
# `TwilightMC Bolide (<tag>)` with `is_prerelease: true`. Backport tags
# (`alpha-v0.0.X`) get the `TwilightMC Bolide v0.0.X (Backported)` title.
#
# Stable and Star tags use release.yml / beta.yml; roll-forward pushes use
# snapshot.yml. The tag patterns are disjoint, so a tag never builds twice.

on:
  push:
    tags:
      - 'alpha-*'
      - 'v[0-9]*.[0-9]*.[0-9]*a[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      channel: alpha
      tag: ${{ github.ref_name }}
      prerelease: true
      rolling: false
